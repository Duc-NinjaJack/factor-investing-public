# QVM Strategy Configuration v2.0.1
# ===================================
# Simplified configuration for current QVM strategy with basic factors
# Author: Raymond
# Created: August 16, 2025
# Updated: August 17, 2025
# Version: 2.0.1
# Purpose: Simple factor investing strategy configuration
# Location: config/strategy_config_v2_0_1_simple.yml

# Strategy Configuration
strategy:
  name: "QVM Simple Factors"
  version: "2.0.1"
  description: "Quality, Value, Momentum and Defensive strategy with simple factor definitions"
  
  # Portfolio settings
  portfolio:
    universe_size: 728
    portfolio_size: 20
    starting_capital: 10_000_000_000  # 10B VND
    
  # Date range
  date_range:
    start: "2016-01-01"
    end: "2025-12-31"

# Factor Weights
factor_weights:
  quality: 0.25
  value: 0.25
  momentum: 0.25
  defensive: 0.25

# QVM Composite Configuration (Required by parent class)
qvm_composite:
  weights:
    quality: 0.25
    value: 0.25
    momentum: 0.25
    defensive: 0.25
  enhanced_weights:
    quality: 0.25
    value: 0.25
    momentum: 0.25
    defensive: 0.25

# Weights Configuration (Required by parent class)
weights:
  quality: 0.25
  value: 0.25
  momentum: 0.25
  defensive: 0.25

# Flat Composite Weights (Required by parent class)
flat_composite_weights:
  # Quality weights for different sectors (parent class expects these names)
  quality_non_financial:
    roaa: 0.5
    f_score: 0.5
  
  quality_banking:
    roaa: 0.5
    f_score: 0.5
  
  quality_securities:
    roaa: 0.5
    f_score: 0.5
  
  # Enhanced quality weights for different sectors (v2.1.1 uses these)
  quality_enhanced_non_financial:
    roaa: 0.5
    f_score: 0.5
  
  quality_enhanced_banking:
    roaa: 0.5
    f_score: 0.5
  
  quality_enhanced_securities:
    roaa: 0.5
    f_score: 0.5
  
  # Value weights (parent class expects these)
  value:
    earnings_yield: 0.5
    fcf_yield: 0.5
  
  # Momentum weights (parent class expects these)
  momentum:
    positive_momentum: 0.6
    contrarian_momentum: 0.4
  
  # Value enhanced weights
  value_enhanced:
    earnings_yield: 0.5
    fcf_yield: 0.5
  
  # Momentum weights
  momentum:
    positive_momentum: 0.6
    contrarian_momentum: 0.4
  
  # Defensive weights
  defensive:
    low_volatility: 1.0

# Quality Factor Configuration
quality:
  # Tier weights for quality factors
  tier_weights:
    roaa: 0.5
    fscore: 0.5
  
  # Simple quality metrics: 50% ROAA + 50% F-Score weighting
  metrics:
    roaa:
      enabled: true
      weight: 0.5  # 50% of quality score
      calculation: "NetProfit_TTM / AvgTotalAssets"
      normalization: "0-15% range normalized to 0-1"
    fscore:
      enabled: true
      weight: 0.5  # 50% of quality score
      calculation: "Piotroski F-Score (sector-specific)"
      variants:
        non_financial: 9  # 9 tests for non-financial sectors
        banking: 6         # 6 tests for banking sector
        securities: 5      # 5 tests for securities sector
      normalization: "Raw score / max_score for sector"

# Value Factor Configuration
value:
  # Metric weights for value factors
  metric_weights:
    earnings_yield: 0.5
    fcf_yield: 0.5
  
  # Revenue metrics
  revenue_metrics:
    enabled: false
  
  # Simple value metrics
  metrics:
    earnings_yield:
      enabled: true
      weight: 0.5  # 50% of value score
      calculation: "NetProfit_TTM / Market_Cap"
    fcf_yield:
      enabled: true
      weight: 0.5  # 50% of value score
      calculation: "FCF / Market_Cap"  # Simplified to Market Cap

# Momentum Factor Configuration
momentum:
  # Timeframe weights for momentum factors
  timeframe_weights:
    positive_momentum: 0.6
    contrarian_momentum: 0.4
  
  # Lookback periods
  lookback_periods:
    positive_momentum: [3, 6]  # 3M and 6M
    contrarian_momentum: [1, 12]  # 1M and 12M
  
  # Skip months for momentum calculation
  skip_months: 1
  
  # Simple momentum metrics
  metrics:
    positive_momentum:
      enabled: true
      weight: 0.6  # 60% of momentum score
      periods: [3, 6]  # 3M and 6M
    contrarian_momentum:
      enabled: true
      weight: 0.4  # 40% of momentum score
      periods: [1, 12]  # 1M and 12M

# Risk Management Configuration
risk_management:
  enabled: true
  
  # Cash allocation rules based on market drawdown
  cash_allocation:
    drawdown_5: 0.0    # 0% cash for <5% drawdown
    drawdown_10: 0.20   # 20% cash for 5-10% drawdown
    drawdown_15: 0.40   # 40% cash for 10-15% drawdown
    drawdown_20: 0.60   # 60% cash for 15-20% drawdown
    drawdown_25: 0.80   # 80% cash for >20% drawdown
  
  # Default cash allocation
  default_cash: 0.05  # 5% minimum cash

# Data Configuration
data:
  # Database tables
  tables:
    daily_data: "vcsc_daily_data_complete"
    fundamental_data: "vcsc_fundamental_data"
    benchmark: "vnindex_daily"
  
  # Price data
  price_data:
    forward_fill: true
    min_price: 1000  # Minimum price in VND
    
  # Fundamental data
  fundamental_data:
    min_coverage: 0.7  # Minimum data coverage required
    max_staleness_days: 180  # Maximum days for stale data

# Performance Configuration
performance:
  # Rebalancing
  rebalancing_frequency: "M"  # Monthly rebalancing
  
  # Transaction costs (simplified)
  transaction_costs:
    enabled: false  # No transaction costs for simplicity
    
  # Performance metrics
  metrics:
    - "annualized_return"
    - "volatility"
    - "sharpe_ratio"
    - "max_drawdown"
    - "calmar_ratio"
    - "information_ratio"
    - "beta"

# Output Configuration
output:
  # Logging
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Plots
  plots:
    enabled: true
    style: "seaborn-v0_8"
    figure_size: [16, 12]
    
  # Tearsheet
  tearsheet:
    enabled: true
    include_cash_allocation: true
    include_comparison_plots: true

# File Information
file_info:
  location: "config/strategy_config_v2_0_1_simple.yml"
  last_updated: "2025-08-17"
  usage: "Used by 06_QVM_risk_comparison.py for risk management comparison"
  dependencies: "Requires PyYAML for loading"
