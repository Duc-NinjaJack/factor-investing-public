strategy:
  name: "QVM 4-Pillar Flat Strategy (Golden)"
  version: "2.0.1"
  portfolio:
    portfolio_size: 20
    universe_size: 100
    starting_capital: 10000000000

factor_weights:
  quality: 0.25
  value: 0.25
  momentum: 0.25
  defensive: 0.25

f_score:
  use_vectorized_fscore_221: true
  benchmark_both: false

risk_management:
  enabled: true
  default_cash: 0.05
  cash_allocation:
    drawdown_5: 0.20
    drawdown_10: 0.40
    drawdown_15: 0.60
    drawdown_20: 0.80
    drawdown_25: 0.90

normalization:
  min_sector_size: dynamic
  robust: median_mad
  fallback: [sector, industry, market]

backtest:
  active_window:
    start: "2019-01-01"
    end:   "2020-12-31"
  fundamentals:
    reporting_lag_days: 75
  portfolio:
    rebalance_frequency: "M"
  transaction_cost_bps: 10
  slippage_bps: 0
  parallel:
    enabled: true
    warmup_months: 3
  output:
    export_parquet: false


