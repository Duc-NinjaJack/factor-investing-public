name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pytest flake8 mypy

      - name: Lint (flake8)
        run: |
          flake8 . --max-line-length=120 --extend-ignore=E203,W503 || true

      - name: Type check (mypy)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mypy production || true

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q production/tests/phase31_add_fscore/test_unit_core_and_overlay.py

      - name: Run integration tests (small window and golden window)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q production/tests/phase31_add_fscore/test_integration_small_window.py production/tests/phase31_add_fscore/test_no_deprecated_imports.py production/tests/phase31_add_fscore/test_golden_window_metrics.py


